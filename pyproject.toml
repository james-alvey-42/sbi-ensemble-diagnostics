[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbi-ensemble-diagnostics"
version = "1.0.0"
description = "Ensemble learning diagnostics for Simulation-Based Inference"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "James Alvey", email = "jbga2@cam.ac.uk" },
    { name = "Carlo R. Contaldi", email = "c.contaldi@imperial.ac.uk" },
    { name = "Mauro Pieroni", email = "mauro.pieroni@csic.es" },
]
maintainers = [
    { name = "James Alvey", email = "jbga2@cam.ac.uk" },
    { name = "Mauro Pieroni", email = "mauro.pieroni@csic.es" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "torch>=1.10.0",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "corner",
    "imageio",
    "scipy>=1.7.0",
    "sbi==0.23.3",
    "sbibm==1.0.6",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/james-alvey-42/sbi-ensemble-diagnostics"

[tool.setuptools.packages.find]
where = ["."]
include = ["sbi_ensemble_diagnostics*"]

[tool.black]
line-length = 88
